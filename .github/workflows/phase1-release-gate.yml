name: Phase 1 Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase1-gate:
    name: Phase 1 business gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Phase 1 reproducible proof
        run: npm run test:phase1-gate

      - name: Cruise port-day safety proof
        run: node --import tsx scripts/test-cruise-port-day-safety.ts

      - name: Existing API contract regression suite
        run: npm run test:api-contracts

      - name: Existing UI contract regression suite
        run: npm run test:ui-consistency
