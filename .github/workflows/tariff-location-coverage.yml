name: Tariff Location Coverage

on:
  pull_request:
    paths:
      - "lib/tariff-location-resolver.ts"
      - "data/tariff-location-mappings.ts"
      - "scripts/audit-tariff-location-coverage.ts"
      - "data/**"
      - ".github/workflows/tariff-location-coverage.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit territory tariff location coverage
        run: npx tsx scripts/audit-tariff-location-coverage.ts
      - name: Upload tariff coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tariff-location-coverage
          path: reports/tariff-location-coverage.json
          if-no-files-found: warn
